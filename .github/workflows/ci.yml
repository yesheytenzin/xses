name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install CLI regression dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y sqlite3
      - run: cargo fmt --check
      - run: cargo test --all-targets --locked
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo build --locked
      - name: CLI regression flows
        if: runner.os == 'Linux'
        run: |
          python3 verify-xses/flows/regression.py target/debug/xses
          python3 verify-xses/flows/continuations.py target/debug/xses
          python3 verify-xses/flows/safety.py target/debug/xses
      - uses: actions/upload-artifact@v4
        if: failure() && runner.os == 'Linux'
        with:
          name: cli-evidence
          path: |
            /tmp/xses-regression-*/commands.json
            /tmp/xses-continuations-*/commands.json
            /tmp/xses-safety-*/commands.json

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.89'
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets --locked
