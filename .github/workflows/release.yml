name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo test --all-targets --locked
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo build --locked
      - run: sudo apt-get update && sudo apt-get install -y sqlite3
      - run: |
          python3 verify-xses/flows/regression.py target/debug/xses
          python3 verify-xses/flows/continuations.py target/debug/xses
          python3 verify-xses/flows/safety.py target/debug/xses

  build:
    name: Build ${{ matrix.platform }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
            binary: xses
            archive: tar.gz
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            platform: macos-x86_64
            binary: xses
            archive: tar.gz
          - runner: macos-14
            target: aarch64-apple-darwin
            platform: macos-aarch64
            binary: xses
            archive: tar.gz
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64
            binary: xses.exe
            archive: zip
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package archive
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          PLATFORM: ${{ matrix.platform }}
          BINARY: ${{ matrix.binary }}
          ARCHIVE_TYPE: ${{ matrix.archive }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${VERSION#v}"
          mkdir -p dist/package
          if [[ "$ARCHIVE_TYPE" == "zip" ]]; then
            archive="xses-${version}-${PLATFORM}.zip"
            cp "target/${TARGET}/release/${BINARY}" dist/package/
            (cd dist/package && 7z a "../${archive}" "${BINARY}")
          else
            archive="xses-${version}-${PLATFORM}.tar.gz"
            tar -C "target/${TARGET}/release" -czf "dist/${archive}" "${BINARY}"
          fi
          echo "Created dist/${archive}"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && sha256sum *.tar.gz *.zip) > dist/SHA256SUMS
          cat dist/SHA256SUMS
      - name: Unpack binaries for attestation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/unpacked
          for archive in dist/*.tar.gz; do
            destination="dist/unpacked/$(basename "$archive" .tar.gz)"
            mkdir -p "$destination"
            tar -xzf "$archive" -C "$destination"
          done
          for archive in dist/*.zip; do
            destination="dist/unpacked/$(basename "$archive" .zip)"
            mkdir -p "$destination"
            unzip -q "$archive" -d "$destination"
          done
      - name: Generate signed build provenance
        uses: actions/attest@v4
        with:
          subject-path: 'dist/unpacked/**/xses*'
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk '/^## / { if (found) exit; found = 1; next } found { print }' CHANGELOG.md > release-notes.md
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.zip dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --title "xses $GITHUB_REF_NAME" \
            --notes-file release-notes.md
