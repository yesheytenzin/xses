name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-targets --locked
      - run: cargo clippy --all-targets --locked -- -D warnings

  build:
    name: Build ${{ matrix.platform }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
            binary: xses
            archive: tar.gz
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            platform: macos-x86_64
            binary: xses
            archive: tar.gz
          - runner: macos-14
            target: aarch64-apple-darwin
            platform: macos-aarch64
            binary: xses
            archive: tar.gz
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64
            binary: xses.exe
            archive: zip
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package archive
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          PLATFORM: ${{ matrix.platform }}
          BINARY: ${{ matrix.binary }}
          ARCHIVE_TYPE: ${{ matrix.archive }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${VERSION#v}"
          mkdir -p dist/package
          if [[ "$ARCHIVE_TYPE" == "zip" ]]; then
            archive="xses-${version}-${PLATFORM}.zip"
            cp "target/${TARGET}/release/${BINARY}" dist/package/
            (cd dist/package && 7z a "../${archive}" "${BINARY}")
          else
            archive="xses-${version}-${PLATFORM}.tar.gz"
            tar -C "target/${TARGET}/release" -czf "dist/${archive}" "${BINARY}"
          fi
          echo "Created dist/${archive}"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          find dist -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) -print0 \
            | sort -z \
            | xargs -0 sha256sum > dist/SHA256SUMS
          cat dist/SHA256SUMS
      - name: Unpack binaries for attestation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/unpacked
          for archive in dist/*.tar.gz; do
            tar -xzf "$archive" -C dist/unpacked
          done
          for archive in dist/*.zip; do
            unzip -q "$archive" -d dist/unpacked
          done
      - name: Generate signed build provenance
        uses: actions/attest@v4
        with:
          subject-path: 'dist/unpacked/xses*'
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.zip dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --title "xses $GITHUB_REF_NAME" \
            --generate-notes
