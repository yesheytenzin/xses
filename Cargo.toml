[package]
name = "xses"
version = "0.8.2"
edition = "2021"
rust-version = "1.89"
description = "Unified picker and cross-importer for AI coding agent sessions"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2"
ratatui = "0.29"
crossterm = "0.28"
fuzzy-matcher = "0.3"
dirs = "6"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = true
strip = true
